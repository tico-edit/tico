[package]
name = "tico"
version = "0.1.0"
edition = "2024"
description = "Yet Another Text Editor"
repository = "https://github.com/tico-edit/tico"
# MIT, except the files copied from Helix (MPL-2.0): src/syntax/queries/diff.scm,
# src/syntax/queries/hcl.scm, src/syntax/queries/pascal.scm and the built-in
# themes under themes/; see README.md.
# grammars/tree-sitter-vcl/ and grammars/tree-sitter-pascal/ are vendored MIT
# grammars (copyright ntsk and Philip Zander respectively), so they add no
# license term; see their READMEs.
license = "MIT AND MPL-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
regex = "1.13.1"
# LF is the only line break: ropey's default `cr_lines`/`unicode_lines`
# would also split at a lone CR, VT, FF, NEL and U+2028/9, all of which
# nano keeps as ordinary characters within a line (shown as ^M, ^L, ...).
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
similar = "3.2.0"
thiserror = "2.0.20"
toml = "1.1.6"
tree-sitter = "0.26"
tree-sitter-bash = "0.25.1"
tree-sitter-batch = "0.11.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.5"
# Dockerfiles use wharflab's maintained fork of camdencheek's grammar (the
# one Helix and nvim-treesitter use): the original's crates.io release
# pins tree-sitter 0.20 and its git HEAD 0.24, neither of which unifies
# with the 0.26 everything else here is on.
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.2.1"
tree-sitter-haskell = "0.23.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = "0.23.1"
tree-sitter-language = "0.1"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-nim = "0.1.0"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-properties = "0.3.0"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-scss = "1.0.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-vim = "0.4.0"
# The V grammar from vlang/v-analyzer, packaged for crates.io by a third
# party (pinned upstream revision recorded in that crate's Cargo.toml).
tree-sitter-vlang = "0.1.0"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
# Perl is the tree-sitter-perl org's grammar (what Helix and nvim-treesitter
# use), published on crates.io under this name; the `tree-sitter-perl` crate
# is an older, unrelated grammar that misparses e.g. a `sub f ($)` prototype.
ts-parser-perl = "2.0.0"
# Groovy is the dekobon fork (https://github.com/dekobon/tree-sitter-groovy),
# not the `tree-sitter-groovy` crate on crates.io: that one's published
# package omits its highlights.scm entirely (see src/syntax/mod.rs), while
# this fork bundles one that matches its own grammar.
dekobon-tree-sitter-groovy = "0.3.0"
# Tcl is the tree-sitter-grammars grammar (what Helix and nvim-treesitter
# use), which isn't published on crates.io under its own name; pulled
# straight from git, pinned to a commit, like tree-sitter-scss below.
tree-sitter-tcl = { git = "https://github.com/tree-sitter-grammars/tree-sitter-tcl", rev = "850a72ab6436e06645b33b11cfa60cbdb04b1f01" }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1.2"


# tree-sitter-scss 1.0.0 on crates.io passes the GCC-only flag
# -Wno-unused-parameter unconditionally in its build.rs, which cl.exe
# (MSVC) rejects with error D8021. Fixed upstream on master (still
# unreleased to crates.io) by using /wd4100 on MSVC instead.
[patch.crates-io]
tree-sitter-scss = { git = "https://github.com/tree-sitter-grammars/tree-sitter-scss", rev = "9ab738d22bb248771d42e8678d1a307d14990df1" }

[package.metadata.deb]
maintainer = "Nobody <devnull@wdlabs.com>"
copyright = "Nobody"
extended-description = """\
Yet Another Text Editor"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/tico", "usr/bin/", "755"],
    ["target/release/tcat", "usr/bin/", "755"],
    ["target/release/ttee", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tico/README.md", "644"],
    ["LICENSE", "usr/share/doc/tico/LICENSE", "644"],
    ["LICENSE-MPL-2.0", "usr/share/doc/tico/LICENSE-MPL-2.0", "644"],
]

